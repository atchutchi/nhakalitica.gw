name: Testes

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  django:
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt

      - name: Validar migrações
        run: python manage.py makemigrations --check --dry-run

      - name: Validar configuração
        run: python manage.py check

      - name: Validar configuração de produção
        env:
          DEBUG: "False"
          SECRET_KEY: "ci-only-secret-key-with-more-than-fifty-characters-and-random-content"
          ALLOWED_HOSTS: "nhakalitica.gw,www.nhakalitica.gw"
          CSRF_TRUSTED_ORIGINS: "https://nhakalitica.gw,https://www.nhakalitica.gw"
          PUBLIC_BASE_URL: "https://nhakalitica.gw"
        run: python manage.py check --deploy

      - name: Detectar artefactos de codificação
        run: python manage.py test tests.test_project_configuration.KaliticaConfigurationTests.test_source_has_no_encoding_artifacts

      - name: Executar testes
        run: python manage.py test
