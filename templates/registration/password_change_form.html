{% extends "settings_base.html" %}
{% block title %}Segurança | Kalitica{% endblock %}
{% block settings_content %}
<header class="settings-heading">
  <p class="member-eyebrow">Conta e segurança</p>
  <h1>Segurança</h1>
  <p>Escolhe uma palavra-passe forte e exclusiva para proteger a tua conta.</p>
</header>
<section class="settings-card">
  <h2>Alterar palavra-passe</h2>
  <form class="settings-form" method="post">{% csrf_token %}{{ form.as_p }}<button class="k-btn k-btn-primary" type="submit">Guardar nova palavra-passe</button></form>
</section>
{% endblock %}
